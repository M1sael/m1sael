name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: M1sael
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ffdd54&color_dots=#0d1117,#3d1f36,#5c2d52,#8b3a7a,#714B67
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ffdd54

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
